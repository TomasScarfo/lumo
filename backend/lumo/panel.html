<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lumo</title>
<meta name="robots" content="noindex">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: una columna pensada para el celular, dividida en seis secciones con una barra de pestañas fija.
   Cada sección responde una sola pregunta: cómo voy, qué hago, qué se rompió, qué me conviene, qué crece, qué significa. */
:root {
  --bg: #F2F5F8;
  --surface: #FFFFFF;
  --surface-2: #E9EEF3;
  --ink: #13202C;
  --ink-2: #44566A;
  --ink-3: #5A6B7C;
  --line: #DAE2E9;
  --accent: #2446D6;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E9FC;
  --good: #146C43;
  --on-good: #FFFFFF;
  --good-soft: #D9F1E3;
  --warn: #8F5200;
  --warn-soft: #FBEACB;
  --bad: #B42318;
  --bad-soft: #FADFDB;
  --font-display: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B131A; --surface: #131E28; --surface-2: #1B2834; --ink: #E7EDF3; --ink-2: #B1BECB; --ink-3: #8F9FAF;
    --line: #263543; --accent: #8BA0FF; --accent-ink: #0B131A; --accent-soft: #1E2B55;
    --good: #52CC8C; --on-good: #07140D; --good-soft: #143525; --warn: #F2B24E; --warn-soft: #3A2A0D;
    --bad: #FF8F83; --bad-soft: #42201C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B131A; --surface: #131E28; --surface-2: #1B2834; --ink: #E7EDF3; --ink-2: #B1BECB; --ink-3: #8F9FAF;
  --line: #263543; --accent: #8BA0FF; --accent-ink: #0B131A; --accent-soft: #1E2B55;
  --good: #52CC8C; --on-good: #07140D; --good-soft: #143525; --warn: #F2B24E; --warn-soft: #3A2A0D;
  --bad: #FF8F83; --bad-soft: #42201C; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
.page { max-width: 800px; margin: 0 auto; }
.wrap { display: flex; flex-direction: column; gap: 18px; }
.panel { display: flex; flex-direction: column; gap: 26px; scroll-margin-top: 70px; }
.panel > *, .wrap > * { min-width: 0; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.2; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ic { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Header and navigation */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.brand-mark .ic { width: 20px; height: 20px; stroke-width: 2.4; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.1; }
.brand-store { font-size: .85rem; color: var(--ink-3); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 7px 13px; border-radius: 999px; font-size: .9rem; font-weight: 600; color: var(--ink-2); min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.notice { display: flex; gap: 8px; align-items: flex-start; font-size: .85rem; color: var(--ink-2); background: var(--accent-soft); padding: 9px 12px; border-radius: 10px; }
.notice .ic { margin-top: 2px; color: var(--accent); }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 11; background: var(--bg); display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; margin-inline: -2px; padding-inline: 2px; }
.nav::-webkit-scrollbar { display: none; }
.nav button { border: 0; background: none; padding: 12px 12px 11px; font-weight: 600; font-size: .95rem; color: var(--ink-3); white-space: nowrap; border-bottom: 3px solid transparent; display: inline-flex; gap: 7px; align-items: center; }
.nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.badge { background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: .72rem; font-weight: 700; min-width: 20px; height: 20px; padding: 0 6px; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }

/* Pantallas anchas: las secciones pasan a un panel fijo a la izquierda */
@media (min-width: 900px) {
  .page { max-width: 1120px; }
  .wrap { display: grid; grid-template-columns: 232px minmax(0, 1fr); column-gap: 32px; row-gap: 18px; align-items: start; }
  .wrap > .top, .wrap > .notice { grid-column: 1 / -1; }
  .wrap > .nav { grid-column: 1; grid-row: 3; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); flex-direction: column; overflow: visible; gap: 4px; margin: 0; padding: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; z-index: 5; }
  .wrap > #panel { grid-column: 2; grid-row: 3; }
  .nav button { width: 100%; justify-content: space-between; text-align: left; padding: 11px 12px; border-bottom: 0; border-radius: 10px; }
  .nav button:hover { background: var(--surface-2); }
  .nav button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); border-bottom: 0; }
}

/* Common */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-head h2 { font-size: 1.3rem; font-weight: 700; }
.sub { color: var(--ink-2); font-size: .95rem; }
.small { font-size: .85rem; color: var(--ink-3); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: .82rem; font-weight: 700; white-space: nowrap; }
.pill .ic { width: 1.05em; height: 1.05em; }
.s-excelente { background: var(--good); color: var(--on-good); }
.s-bien { background: var(--good-soft); color: var(--good); }
.s-atencion { background: var(--warn-soft); color: var(--warn); }
.s-revisar { background: var(--bad-soft); color: var(--bad); }
.s-sindatos { background: var(--surface-2); color: var(--ink-2); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.tag.up { background: var(--good-soft); color: var(--good); }
.tag.down { background: var(--bad-soft); color: var(--bad); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag .ic { width: 1em; height: 1em; stroke-width: 2.6; }
.btn { border: 1px solid transparent; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 9px 16px; border-radius: 10px; min-height: 40px; font-size: .92rem; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.link { border: 0; background: none; padding: 6px 0; color: var(--accent); font-weight: 700; font-size: .92rem; display: inline-flex; align-items: center; gap: 6px; text-align: left; }
.link .ic { transition: transform .15s; }
.link[aria-expanded="true"] .ic { transform: rotate(180deg); }
.empty { display: flex; gap: 12px; align-items: center; color: var(--ink-2); }
.empty .ic { width: 26px; height: 26px; color: var(--good); }

/* Principal: hero */
.hero { border-radius: 18px; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px; }
.hero-head { display: flex; gap: 14px; align-items: flex-start; }
.hero-ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.hero-ic .ic { width: 28px; height: 28px; stroke-width: 2.3; }
.hero h1 { font-size: clamp(1.5rem, 5.5vw, 2rem); font-weight: 700; }
.hero-lines { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; color: var(--ink-2); }
.hero-lines b { color: var(--ink); }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 720px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi-l { font-size: .85rem; color: var(--ink); font-weight: 600; line-height: 1.3; }
.kpi-v { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.4rem, 5vw, 1.75rem); line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi-d { font-size: .8rem; color: var(--ink-3); line-height: 1.35; margin-top: 2px; }
.delta { display: inline-flex; gap: 4px; align-items: flex-start; font-size: .78rem; font-weight: 600; line-height: 1.3; color: var(--ink-3); }
.delta .ic { margin-top: 1px; width: 1em; height: 1em; stroke-width: 2.6; }
.delta.good { color: var(--good); }
.delta.bad { color: var(--bad); }
.group-t { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin-bottom: 8px; }

/* Chart */
.tabs { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: .86rem; font-weight: 600; color: var(--ink-2); min-height: 34px; }
.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.chart-box { position: relative; margin-top: 10px; min-height: 210px; touch-action: pan-y; }
.chart-box svg { display: block; }
.chart-box text { fill: var(--ink-3); font-family: var(--font-body); font-size: 11.5px; }
.bar { fill: var(--accent); transition: opacity .1s; }
.bar.dim { opacity: .45; }
.grid { stroke: var(--line); stroke-width: 1; }
.tt { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 7px 10px; border-radius: 8px; font-size: .82rem; line-height: 1.35; white-space: nowrap; transform: translate(-50%, -100%); z-index: 2; }
.tt b { display: block; font-size: .95rem; font-variant-numeric: tabular-nums; }
.tbl { overflow-x: auto; margin-top: 10px; max-height: 340px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { position: sticky; top: 0; background: var(--surface-2); font-size: .8rem; color: var(--ink-2); }
tr:last-child td { border-bottom: 0; }

/* Campaigns */
.camp { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; scroll-margin-top: 70px; }
.camp-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.camp-top h3 { font-size: 1.12rem; font-weight: 700; min-width: 0; }
.camp-why { color: var(--ink-2); font-size: .95rem; }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; }
.trio div { background: var(--surface-2); border-radius: 10px; padding: 9px 10px; min-width: 0; }
.trio dt { font-size: .75rem; color: var(--ink-3); line-height: 1.25; }
.trio dd { margin: 2px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 1.02rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.budget { display: flex; flex-direction: column; gap: 6px; font-size: .85rem; color: var(--ink-2); }
.meter { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.ads { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.ad { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.ad:last-child { border-bottom: 0; padding-bottom: 0; }
.ad-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.ad-name { font-weight: 600; font-size: .95rem; min-width: 0; }
.ad-nums { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: .85rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ad-nums b { color: var(--ink); }

/* Tabla de campañas */
.cfilters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.cfilters .row { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; }
.cfilters .search { flex: 1 1 240px; width: auto; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); padding: 6px 12px; border-radius: 999px; font-size: .86rem; font-weight: 600; min-height: 36px; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }
.chip b { font-variant-numeric: tabular-nums; }
.ctw { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table.ct { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1120px; font-size: .88rem; }
table.ct th, table.ct td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; background: var(--surface); }
table.ct th { background: var(--surface-2); }
table.ct th:first-child, table.ct td:first-child { position: sticky; left: 0; text-align: left; z-index: 2; min-width: 240px; box-shadow: 1px 0 0 var(--line); }
table.ct th:first-child { z-index: 3; }
table.ct th:nth-child(2), table.ct td:nth-child(2) { text-align: left; }
table.ct tbody tr:last-child td { border-bottom: 0; }
table.ct tr.itr td { background: var(--bg); color: var(--ink-2); }
table.ct tr.itr td:first-child { padding-left: 34px; white-space: normal; max-width: 300px; }
table.ct td .cname { font-weight: 700; font-family: var(--font-display); font-size: 1rem; }
table.ct td .link { padding: 2px 0; font-size: .85rem; }
.sort { border: 0; background: none; padding: 0; font: inherit; font-weight: 700; font-size: .8rem; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; min-height: 28px; }
.sort .ic { width: .95em; height: .95em; stroke-width: 2.6; color: var(--accent); }
.mini { display: inline-block; width: 44px; height: 6px; background: var(--surface-2); border-radius: 999px; margin-left: 8px; overflow: hidden; vertical-align: middle; }
.mini i { display: block; height: 100%; background: var(--accent); }
.mini.cap i { background: var(--warn); }
.dash { color: var(--ink-3); }

/* Alert-style cards (recomendaciones) */
.alert { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; gap: 14px; }
.sev-urgente { --c: var(--bad); --cs: var(--bad-soft); }
.sev-mejora { --c: var(--warn); --cs: var(--warn-soft); }
.sev-oportunidad { --c: var(--accent); --cs: var(--accent-soft); }
.sev-buena { --c: var(--good); --cs: var(--good-soft); }
.a-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--cs); color: var(--c); display: grid; place-items: center; flex: none; }
.a-ic .ic { width: 22px; height: 22px; }
.a-body { min-width: 0; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.a-tag { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--c); }
.a-body h3 { font-size: 1.1rem; font-weight: 700; }
.a-body p { color: var(--ink-2); font-size: .95rem; }
.a-do { background: var(--surface-2); border-radius: 10px; padding: 9px 12px; color: var(--ink) !important; }
.a-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.done-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; color: var(--ink-3); font-size: .9rem; }
.done-item span { min-width: 0; }

/* Alertas: publication cards */
.sum { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sum-i { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 2px; text-align: left; }
.sum-i b { font-family: var(--font-display); font-size: 1.8rem; line-height: 1.1; }
.sum-i span { font-size: .85rem; color: var(--ink-2); line-height: 1.3; }
.blk-h { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.blk-h h2 { font-size: 1.3rem; font-weight: 700; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.item-top { display: flex; flex-direction: column; gap: 6px; }
.item-top h3 { font-size: 1.05rem; font-weight: 700; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; }
@media (min-width: 640px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stats div { background: var(--surface-2); border-radius: 10px; padding: 9px 10px; min-width: 0; }
.stats dt { font-size: .75rem; color: var(--ink-3); line-height: 1.25; }
.stats dd { margin: 2px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 1.02rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stats dd small { font-family: var(--font-body); font-weight: 600; font-size: .78rem; }
.stats dd small.g { color: var(--good); }
.stats dd small.b { color: var(--bad); }
.reco { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: .93rem; color: var(--ink); }
.reco strong { display: block; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-bottom: 2px; }
.rbar { position: relative; height: 10px; background: var(--surface-2); border-radius: 999px; margin: 6px 0 4px; }
.rbar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; }
.rbar .fill.revisar { background: var(--bad); }
.rbar .fill.atencion { background: var(--warn); }
.rbar .mark { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--ink); border-radius: 2px; }
.rlab { display: flex; justify-content: space-between; gap: 10px; font-size: .8rem; color: var(--ink-2); flex-wrap: wrap; }
.impact { font-size: .9rem; color: var(--ink-2); }
.impact b { color: var(--ink); }

/* Tareas */
.prog { display: flex; flex-direction: column; gap: 8px; }
.task { display: flex; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.task:last-child { border-bottom: 0; }
.task label { display: flex; gap: 12px; align-items: flex-start; flex: 1; min-width: 0; cursor: pointer; }
.task input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); flex: none; cursor: pointer; }
.task span { min-width: 0; font-weight: 600; font-size: .96rem; }
.task small { display: block; font-weight: 400; color: var(--ink-2); font-size: .85rem; }
.task.is-done span { color: var(--ink-3); text-decoration: line-through; }
.task.is-done small { text-decoration: none; }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

/* Tendencias */
.dim-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

  list.forEach(function (c) { for (var i = from; i < to; i++) { var d = c.daily[i]; s.spend += d.spend; s.sales += d.sales; s.clicks += d.clicks; s.prints += d.prints; } });

    body = goal + '<div class="wait"><span>Ya registramos tu acción. Los primeros resultados aparecen a los 3 días. Hoy, antes del cambio, ' + (act.scope === 'account' ? 'tu cuenta' : 'esta campaña') + ' tiene un ROAS de <b>$' + r1(base.roas) + '</b> y vende ' + money(base.sales / 7) + ' por día con publicidad.</span><button class="btn ghost" data-act="sim" data-id="' + act.id + '">Ver un ejemplo a los 7 días</button></div>';
  } else {
    var pa = ev.sim ? 'En 7 días' : 'En los ' + ev.n + ' días siguientes';
    body = (ev.sim ? '<div class="sim-note">Simulación de ejemplo: así se vería a los 7 días si la acción funciona como se espera. No son datos reales.</div>' : '') + goal + evChart(act, ev) + '<p class="cap">Ventas por publicidad por día. La línea marca cuándo aplicaste la acción.</p>' + cmpTable(ev) +
      '<p class="say"><b>Qué pasó:</b> ' + pa + ', el ROAS pasó de <b>$' + r1(ev.b.roas) + '</b> a <b>$' + r1(ev.a.roas) + '</b> y las ventas por día de ' + money(ev.b.sales / ev.b.days) + ' a ' + money(ev.a.sales / ev.a.days) + '.' + (ev.ab !== ev.b ? ' En toda tu cuenta, el ROAS pasó de $' + r1(ev.ab.roas) + ' a $' + r1(ev.aa.roas) + '.' : '') + '</p>' +
      '<div class="reco"><strong>Qué hacer ahora</strong>' + nextStep(act, ev) + '</div>';
    var btns = (act.scope !== 'account' ? '<button class="btn ghost" data-act="goCamp" data-c="' + act.scope + '">Ver campaña</button>' : '') + (ev.sim ? '<button class="btn ghost" data-act="sim" data-id="' + act.id + '">Quitar la simulación</button>' : '');
    if (btns) body += '<div class="a-btns">' + btns + '</div>';
  }
  return '<article class="item">' + head + body + '</article>';
}
function seguimientoHTML() {

/* ---------- Tendencias ---------- */

    { n: 'Impresiones perdidas por presupuesto', api: 'lost_impression_share_by_budget', d: 'Porcentaje de oportunidades en las que el anuncio no se mostró porque el presupuesto era muy bajo. Solo viene en el detalle de cada campaña.', ex: 'Un 20% significa que de cada 10 oportunidades, 2 se perdieron por presupuesto.', best: 'Más bajo es mejor. Si es alto y el ROAS está bien, conviene subir el presupuesto.' },
    { n: 'Impresiones perdidas por ranking', api: 'lost_impression_share_by_ad_rank', d: 'Porcentaje de oportunidades en las que el anuncio no se mostró porque su ranking era menor al de otros vendedores. Solo viene en el detalle de cada campaña.', ex: 'Un 15% significa que 15 de cada 100 oportunidades se perdieron frente a otros anuncios.', best: 'Más bajo es mejor. Se mejora con mejores publicaciones o un ROAS objetivo menos exigente.' }

  { g: 'Costos', terms: [

    { n: 'CPC (costo por clic)', api: 'cpc', d: 'Cost Per Click. Es lo que pagás en promedio por cada clic.', ex: '$16.800 invertidos en 120 clics es un CPC de $140.', best: 'Más bajo es mejor, si las ventas se mantienen.' },
    { n: 'Presupuesto diario', api: 'budget', d: 'Promedio diario que podés gastar en una campaña. Si un día no gastás todo, lo que sobra se puede usar en los días siguientes del mes.', ex: 'Con $6.000 por día, si un día gastás $5.000, te quedan $1.000 más para los próximos días.', best: 'Tiene que alcanzar para las campañas que rinden bien.' }
  ]},
  { g: 'Eficiencia', terms: [
    { n: 'ROAS (retorno de la inversión publicitaria)', api: 'roas', d: 'Return On Ad Spend. Cuánto vendés por cada $1 que invertís en publicidad.', ex: 'Invertiste $10.000 y vendiste $60.000 con anuncios: el ROAS es $6 por cada $1.', best: 'Más alto es mejor. Se compara con tu ROAS objetivo.' },
    { n: 'ROAS objetivo', api: 'roas_target', d: 'El ROAS mínimo que esperás de una campaña. Se configura campaña por campaña en Mercado Libre y Lumo lo lee de ahí. Si una campaña solo informa su ACOS objetivo, usamos ROAS objetivo = 100 ÷ ACOS objetivo.', ex: 'Un ROAS objetivo de $5 equivale a un ACOS objetivo del 20%.', best: 'Es la vara del semáforo de cada campaña.' },
    { n: 'ACOS (costo publicitario de ventas)', api: 'acos', d: 'Advertising Cost of Sales. Qué porcentaje de lo vendido con publicidad se fue en anuncios. Es el ROAS al revés.', ex: 'Invertiste $10.000 y vendiste $60.000: el ACOS es 16,7%. Un ROAS de $5 equivale a un ACOS del 20%.', best: 'Más bajo es mejor.' },
    { n: 'CVR (tasa de conversión)', api: 'cvr', d: 'Conversion Rate. Es el porcentaje de clics que terminan en una compra.', ex: '120 clics y 4 compras es un CVR del 3,3%.', best: 'Más alto es mejor.' }
  ]},
  { g: 'Ventas por publicidad', terms: [
    { n: 'Ventas directas (monto)', api: 'direct_amount', d: 'Valor de las ventas directas en moneda local. Hay una venta directa cuando alguien toca tu anuncio y compra ese mismo producto.', ex: 'Alguien toca el anuncio de una cortina y compra esa cortina.', best: 'Más es mejor.' },

    { n: 'Ventas totales por publicidad (monto)', api: 'total_amount', d: 'Suma de las ventas directas y asistidas. Es el número que usamos como Ventas por publicidad.', ex: '$40.000 directas más $20.000 asistidas son $60.000.', best: 'Más es mejor.' },
    { n: 'Unidades directas', api: 'direct_units_quantity', d: 'Cantidad de unidades vendidas de forma directa gracias a tus anuncios.', ex: 'Se vendieron 3 cortinas tocando el anuncio de esa cortina.', best: 'Más es mejor.' },

    { n: 'Cantidad de ventas directas', api: 'direct_items_quantity', d: 'Cantidad de ventas directas que vinieron de tus anuncios.', ex: '4 ventas en las que alguien tocó el anuncio y compró ese mismo producto.', best: 'Más es mejor.' },
    { n: 'Cantidad de ventas asistidas', api: 'indirect_items_quantity', d: 'Cantidad de ventas asistidas que vinieron de tus anuncios.', ex: '2 ventas en las que alguien tocó un anuncio y terminó comprando otro producto.', best: 'Más es mejor.' },
    { n: 'Cantidad de ventas por publicidad', api: 'advertising_items_quantity', d: 'Cantidad total de ventas que vinieron de tus anuncios, directas y asistidas.', ex: '4 directas y 2 asistidas son 6 ventas.', best: 'Más es mejor.' }
  ]},
  { g: 'Ventas orgánicas', terms: [
    { n: 'Ventas orgánicas (monto)', api: 'organic_units_amount', d: 'Valor de las ventas que llegaron sin pasar por un anuncio, en moneda local.', ex: 'Alguien encuentra tu manta en una búsqueda normal y la compra.', best: 'Más es mejor. Sirve para comparar con lo que vendés con publicidad.' },

    { n: 'Cantidad de ventas orgánicas', api: 'organic_items_quantity', d: 'Cantidad de ventas que llegaron sin pasar por un anuncio.', ex: '9 ventas sin publicidad en el período.', best: 'Más es mejor.' }
  ]}
];
function glossaryListHTML() {
  var q = S.q.trim().toLowerCase(), any = false;
  var html = GLOSSARY.map(function (grp) {
    var terms = grp.terms.filter(function (t) { return !q || (t.n + ' ' + t.api + ' ' + t.d).toLowerCase().indexOf(q) !== -1; });
    if (!terms.length) return '';
    any = true;
    return '<section class="gl-group" aria-label="' + grp.g + '"><h2>' + grp.g + '</h2>' + terms.map(function (t) {
      return '<article class="term"><div class="term-top"><h3>' + t.n + '</h3><code>' + t.api + '</code></div><p>' + t.d + '</p><p class="ex"><b>Ejemplo:</b> ' + t.ex + '</p>' +
        '<div class="meta"><span class="tag">' + t.best + '</span>' + (t.check ? '<span class="tag warn">Definición a confirmar</span>' : '') + '</div></article>';
    }).join('') + '</section>';
  }).join('');
  return any ? html : '<div class="card empty">' + icon('info') + '<p>No encontramos esa métrica. Probá con otra palabra, por ejemplo ROAS o clics.</p></div>';
}
function glosarioHTML() {
  var count = GLOSSARY.reduce(function (a, g) { return a + g.terms.length; }, 0);

    '<p class="sub" style="margin-bottom:12px">Cada métrica en palabras simples, con un ejemplo. El código gris es el nombre que usa la API de Product Ads.</p>' +
    '<input type="search" class="search" id="glq" data-act="glq" placeholder="Buscar una métrica, por ejemplo ROAS" value="' + S.q.replace(/"/g, '&quot;') + '" aria-label="Buscar una métrica"></section>' +
    '<div class="panel" id="glList" style="gap:22px">' + glossaryListHTML() + '</div>' +
    '<p class="small">Las definiciones de las métricas con la etiqueta "a confirmar" son una interpretación en palabras simples. Conviene validarlas contra la documentación oficial antes de publicarlas.</p>';

/* ---------- Render ---------- */
function fkey(el) { return el ? el.dataset.act + '|' + (el.dataset.id || el.dataset.c || el.dataset.v || el.dataset.d || '') : ''; }
function render() {
  var ae = document.activeElement, k = ae && ae.dataset && ae.dataset.act && ae.dataset.act !== 'glq' && ae.dataset.act !== 'draft' && ae.dataset.act !== 'cq' ? fkey(ae) : '';
  var keepGl = ae && ae.id === 'glq', keepDraft = ae && ae.id === 'newTask', keepCq = ae && ae.id === 'cq';
  M = compute();
  var panels = { principal: principalHTML, tareas: tareasHTML, alertas: alertasHTML, recomendaciones: recsHTML, seguimiento: seguimientoHTML, tendencias: trendsHTML, glosario: glosarioHTML };
  $('#dyn').innerHTML = '<div class="wrap">' + topHTML() + navHTML() + '<div id="panel" class="panel" role="tabpanel">' + panels[S.tab]() + '</div></div>' + toastHTML();
  if (k) { var els = document.querySelectorAll('#dyn [data-act]'); for (var i = 0; i < els.length; i++) { if (fkey(els[i]) === k) { els[i].focus({ preventScroll: true }); break; } } }
  if (keepGl && $('#glq')) $('#glq').focus({ preventScroll: true });
  if (keepDraft && $('#newTask')) $('#newTask').focus({ preventScroll: true });
  if (keepCq && $('#cq')) { var cq = $('#cq'); cq.focus({ preventScroll: true }); cq.setSelectionRange(cq.value.length, cq.value.length); }
  if (S.toast) { clearTimeout(toastTimer); toastTimer = setTimeout(function () { S.toast = ''; var t = $('#toast'); if (t) t.remove(); }, 8000); }
  var sel = document.querySelector('.nav [aria-selected="true"]'), nav = $('.nav');
  if (sel && nav) nav.scrollLeft = sel.offsetLeft - (nav.clientWidth - sel.offsetWidth) / 2;
  drawChart();
  saveState();
}
function goPanelTop() {
  var p = $('#panel'); if (!p) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (window.matchMedia('(min-width: 900px)').matches) { window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); return; }
  p.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var a = b.dataset.act;
  if (a === 'draft' || a === 'glq' || a === 'cq') return;
  if (a === 'days') S.days = +b.dataset.v;
  else if (a === 'tab' || a === 'goTab') { S.tab = b.dataset.v; render(); goPanelTop(); return; }
  else if (a === 'sort') { var col = COLS.filter(function (x) { return x.k === b.dataset.v; })[0]; S.sort = S.sort.k === col.k ? { k: col.k, d: -S.sort.d } : { k: col.k, d: col.d }; }
  else if (a === 'fstat') S.fstat = b.dataset.v;
  else if (a === 'clearF') { S.fstat = 'all'; S.cq = ''; }
  else if (a === 'toggleAll') { var every = M.camps.every(function (c) { return S.open[c.id]; }); M.camps.forEach(function (c) { S.open[c.id] = !every; }); }
  else if (a === 'metric') S.metric = b.dataset.v;
  else if (a === 'table') S.table = !S.table;
  else if (a === 'toggleCamp') S.open[b.dataset.id] = !S.open[b.dataset.id];
  else if (a === 'done') { S.done[b.dataset.id] = true; recordAction(b.dataset.id); }
  else if (a === 'undo') { delete S.done[b.dataset.id]; removeAction(b.dataset.id); }
  else if (a === 'toggleTask') { if (S.done[b.dataset.id]) { delete S.done[b.dataset.id]; removeAction(b.dataset.id); } else { S.done[b.dataset.id] = true; recordAction(b.dataset.id); } }
  else if (a === 'sim') S.sim[b.dataset.id] = !S.sim[b.dataset.id];
  else if (a === 'closeToast') S.toast = '';
  else if (a === 'allLow') S.showAllLow = !S.showAllLow;
  else if (a === 'dim') S.trendDim = b.dataset.v;
  else if (a === 'sw') S.sw[b.dataset.id] = !S.sw[b.dataset.id];
  else if (a === 'goCamp') {
    S.tab = 'principal'; S.open[b.dataset.c] = true; render();
    var el = document.getElementById('camp-' + b.dataset.c);
    if (el) el.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    return;
  } else return;
  render();
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'newTask') S.draft = e.target.value;
  if (e.target.id === 'cq') { S.cq = e.target.value; render(); }
  if (e.target.id === 'glq') { S.q = e.target.value; var l = $('#glList'); if (l) l.innerHTML = glossaryListHTML(); }
});
document.addEventListener('submit', function (e) {
  if (e.target.id !== 'addForm') return;
  e.preventDefault();
  var v = S.draft.trim(); if (!v) return;
  S.custom.push({ id: 'custom-' + Date.now(), title: v.replace(/</g, '&lt;') });
  S.draft = ''; render();
});

var hash = (location.hash || '').replace('#', '');
if (TABS.some(function (t) { return t[0] === hash; })) S.tab = hash;
render();
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(function () { drawChart(); }).observe(document.querySelector('.page'));
}
var dyn = document.getElementById('dyn');
function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function say(html) { dyn.innerHTML = '<div class="wrap"><section class="card empty" style="margin-top:12vh;text-align:center">' + html + '</section></div>'; }
var MSG = {
  no_ads: '<h2>Tu cuenta todavía no tiene Publicidad habilitada</h2><p class="sub">Entrá a Mercado Libre, Mi perfil, Publicidad, activala y volvé.</p>',
  forbidden: '<h2>Mercado Libre no dejó leer Product Ads</h2><p class="sub">Puede ser un permiso de la cuenta. <a class="link" href="/connect">Volver a conectar</a></p>',
  busy: '<h2>Mercado Libre pidió esperar un momento</h2><p class="sub">Probá de nuevo en un minuto. <a class="link" href="/panel">Reintentar</a></p>',
  api: '<h2>No pudimos leer tus datos</h2><p class="sub">Fue un error de Mercado Libre. <a class="link" href="/panel">Reintentar</a></p>'
};
var qs = new URLSearchParams(location.search), want = [];
if (qs.get('adv')) want.push('adv=' + encodeURIComponent(qs.get('adv')));
if (qs.get('refresh') === '1') want.push('refresh=1');
say('<h2>Trayendo tus datos de Mercado Libre…</h2><p class="sub">La primera vez puede tardar unos segundos.</p>');
fetch('/api/datos' + (want.length ? '?' + want.join('&') : ''), { credentials: 'same-origin' })
  .then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
  .then(function (x) {
    if (x.s === 401) { location.href = x.j.error === 'reconnect' ? '/connect' : '/'; return; }
    if (x.j.error) { say((MSG[x.j.error] || MSG.api) + (x.j.detail ? '<p class="small">Detalle técnico: <code>' + esc(x.j.detail) + '</code></p>' : '')); return; }
    if (!x.j.camps.length) { say('<h2>Todavía no tenés campañas de Product Ads</h2><p class="sub">Cuando crees una en Mercado Libre, va a aparecer acá.</p>'); return; }
    history.replaceState(null, '', '/panel' + location.hash);
    boot(x.j);
  })
  .catch(function () { say(MSG.api); });
