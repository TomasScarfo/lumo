services:
  # Portada estática: no se duerme y carga al instante. Sus botones despiertan y abren la app (servicio "lumo").
  # Al publicar, Render reemplaza __APP_URL__ por la dirección de la app (variable APP_URL, sin barra al final).
  - type: web
    name: lumo-sitio
    runtime: static
    buildCommand: test -n "$APP_URL" && sed -i "s#__APP_URL__#${APP_URL%/}#g" site/index.html
    staticPublishPath: ./site
    # Encabezados de seguridad de la portada (la app los manda por su cuenta, en lumo/security.py).
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'none'"
    envVars:
      - key: APP_URL
        sync: false
  - type: web
    name: lumo
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Render genera estos dos valores una sola vez y los conserva entre despliegues.
      # Guardá una copia de ENCRYPTION_KEY: si se pierde, cada cuenta tiene que volver a conectarse.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      # Solo durante una rotación de ENCRYPTION_KEY: la clave anterior. Ver docs/seguridad/politicas.md.
      - key: ENCRYPTION_KEY_PREVIOUS
        sync: false
      # Los valores secretos se cargan a mano en el panel de Render (sync: false), nunca en este archivo.
      - key: ML_CLIENT_ID
        sync: false
      - key: ML_CLIENT_SECRET
        sync: false
      - key: REDIRECT_URI
        sync: false
      - key: DATABASE_URL
        sync: false
      # IDs de Mercado Libre de quienes administran Lumo (separados por coma). Sin esto, nadie puede crear invitaciones.
      - key: ADMIN_USER_IDS
        sync: false
      # Cobro con Mercado Pago (Access Token de producción y clave secreta de Webhooks).
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      # Precios en dólares (se cobran en pesos a la cotización oficial del día).
      - key: PLAN_PRICE_USD
        value: "5.99"
      - key: PLAN_PRICE_ANNUAL_USD
        value: "59.99"
      - key: TRIAL_DAYS
        value: "14"
      # Días que sigue entrando una cuenta con un cobro rechazado, antes de suspenderse.
      - key: GRACE_DAYS
        value: "7"
      # Dirección de la portada estática (servicio "lumo-sitio"). Con esto, quien entra a la app sin sesión va a la portada.
      - key: SITE_URL
        sync: false
      # Avisos por email: se envían por la API de Brevo (el SMTP está bloqueado en el plan gratis de Render).
      # MAIL_FROM es el remitente verificado en Brevo (por ejemplo lumoads.ml@gmail.com).
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Alternativa sin Brevo (solo en planes de pago de Render): contraseña de aplicación de Gmail.
      - key: SMTP_PASSWORD
        sync: false
      # Clave para el chequeo diario.
      - key: CRON_TOKEN
        sync: false
