services:
  # Portada estática: no se duerme y carga al instante. Sus botones despiertan y abren la app (servicio "lumo").
  # Al publicar, Render reemplaza __APP_URL__ por la dirección de la app (variable APP_URL, sin barra al final).
  - type: web
    name: lumo-sitio
    runtime: static
    buildCommand: test -n "$APP_URL" && sed -i "s#__APP_URL__#${APP_URL%/}#g" site/index.html
    staticPublishPath: ./site
    envVars:
      - key: APP_URL
        sync: false
  - type: web
    name: lumo
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Render genera estos dos valores una sola vez y los conserva entre despliegues.
      # Guardá una copia de ENCRYPTION_KEY: si se pierde, cada cuenta tiene que volver a conectarse.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      # Los valores secretos se cargan a mano en el panel de Render (sync: false), nunca en este archivo.
      - key: ML_CLIENT_ID
        sync: false
      - key: ML_CLIENT_SECRET
        sync: false
      - key: REDIRECT_URI
        sync: false
      - key: DATABASE_URL
        sync: false
      # IDs de Mercado Libre de quienes administran Lumo (separados por coma). Sin esto, nadie puede crear invitaciones.
      - key: ADMIN_USER_IDS
        sync: false
      # Dirección de la portada estática (servicio "lumo-sitio"). Con esto, quien entra a la app sin sesión va a la portada.
      - key: SITE_URL
        sync: false
