# Control de cambios: ningún cambio llega a producción sin pasar los tests, el análisis de seguridad y la revisión de dependencias.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 1"   # cada lunes, para enterarse de vulnerabilidades nuevas aunque no haya cambios
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar
        run: pip install -r backend/requirements.txt pip-audit==2.9.0 bandit==1.8.3
      - name: Tests
        working-directory: backend
        run: python -m unittest discover -s tests
      - name: Análisis estático de seguridad (bandit)
        working-directory: backend
        run: bandit -q -r lumo rotate_keys.py -ll
      - name: Vulnerabilidades conocidas en dependencias (pip-audit)
        working-directory: backend
        run: pip-audit -r requirements.txt --strict
