# Control de cambios: ningún cambio llega a producción sin pasar los tests, el análisis de seguridad y la revisión de dependencias.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 1"   # cada lunes, para enterarse de vulnerabilidades nuevas aunque no haya cambios
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar
        run: pip install -r backend/requirements.txt pip-audit==2.9.0 bandit==1.8.3
      - name: Tests
        working-directory: backend
        run: python -m unittest discover -s tests
      - name: Análisis estático de seguridad (bandit)
        working-directory: backend
        run: bandit -q -r lumo rotate_keys.py -ll
      - name: Vulnerabilidades conocidas en dependencias (pip-audit)
        working-directory: backend
        run: pip-audit -r requirements.txt --strict
