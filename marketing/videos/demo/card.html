<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;height:100%;background:#F3F6FA;font-family:Figtree,sans-serif;color:#14202B}
.c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
img{width:110px;height:110px;border-radius:26px;box-shadow:0 14px 44px rgba(36,70,214,.35);animation:on 1.2s ease-out both}
h1{font:800 54px/1.1 'Bricolage Grotesque',sans-serif;margin:0;letter-spacing:-.01em}
h1 em{font-style:normal;color:#2446D6}
p{font-size:24px;color:#4A5B6B;margin:0;max-width:820px}
.b{display:inline-block;margin-top:10px;background:#2446D6;color:#fff;font-weight:700;font-size:24px;padding:16px 30px;border-radius:14px}
.u{font:700 28px 'Bricolage Grotesque',sans-serif;color:#2446D6}
@keyframes on{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.c>*:not(img){animation:up .8s ease-out .35s both}@keyframes up{from{opacity:0;transform:translateY(14px)}}
</style></head><body><div class="c" id="c"></div>
<script>
var k = location.hash.slice(1);
document.getElementById('c').innerHTML = k === 'fin'
  ? '<img src="/static/logo.svg" alt=""><h1>Tu publicidad en Mercado Libre, <em>por fin clara</em>.</h1><p>Probalo gratis 14 días. Si cancelás antes, no pagás nada.</p><span class="b">Probar gratis</span><span class="u">lumoads.com.ar</span>'
  : '<img src="/static/logo.svg" alt=""><h1>Lumo</h1><p>Tu asistente de publicidad en Mercado Libre: lee tus campañas de Product Ads y te dice, en palabras simples, qué mejorar primero.</p><p style="font-size:18px;color:#7A8A99">Recorrido por la app con datos de ejemplo</p>';
</script></body></html>
